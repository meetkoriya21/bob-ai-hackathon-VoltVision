submission:
  title: "GridGuard AI — Power Outage Prediction & Grid Equipment Failure Advisor"

  problem_statement: >
    Electric utilities lack a unified view correlating equipment sensor health,
    active weather conditions, and historical failure patterns. Grid reliability
    teams spend 45-90 minutes per asset manually checking three disconnected
    systems before dispatching maintenance crews — leading to reactive post-failure
    responses that affect 15,000-80,000 customers per event and cost $2-5M each.

  solution_summary: >
    GridGuard AI combines sensor data, weather zone risk, and historical incident
    records into a transparent Failure Risk score weighted by Grid Impact
    (Maintenance Priority = Failure Risk x Grid Impact x 100). IBM watsonx.ai
    Granite 3.1 Instruct generates natural-language maintenance recommendations
    with urgency levels and crew pre-positioning guidance for at-risk assets.

  key_features:
    - "Explainable failure risk scoring — transparent weighted formula (sensor 50% + weather 30% + history 20%) with IEEE/IEC thresholds"
    - "Grid Impact-weighted maintenance priority ranking — ensures high-consequence assets rank first, not just high-risk ones"
    - "IBM watsonx.ai (Granite 3.1 Instruct) maintenance advisory with urgency, action plan, and crew pre-positioning"
    - "Multi-dimensional asset detail: sensor gauges, risk breakdown charts, weather panel, incident history in one screen"
    - "Professional grid operations dashboard with real-time KPI cards, sortable priority table, and weather zone monitor"

  tech_stack:
    languages: ["Python 3.11", "JavaScript ES2022"]
    frameworks: ["FastAPI", "React 18", "Vite 8", "Tailwind CSS 4"]
    ibm_technologies: ["IBM Bob", "watsonx.ai (ibm/granite-3-1-8b-instruct)"]
    databases: []
    other: ["Recharts", "React Router", "ibm-watsonx-ai SDK", "Uvicorn", "Lucide React"]

  what_we_are_most_proud_of: >
    The transparent, explainable risk scoring engine combined with the Grid Impact
    priority matrix. Every number traces to specific sensor thresholds, weather
    conditions, and historical incidents — documented against IEEE/IEC standards.
    Maintenance Priority = Failure Risk x Grid Impact correctly ranks a moderately
    degraded downtown transformer ahead of a highly degraded rural feeder switch,
    which is exactly the insight utility operators need. IBM Bob was central to
    the entire development workflow, from architecture to implementation.

  known_limitations: >
    Sensor and weather data are representative fixtures, not live SCADA/API feeds.
    The architecture is designed for real API integration. No user authentication
    (appropriate for internal utility network). watsonx.ai recommendations require
    credentials in .env; the local fallback engine works without them.

